---
- name: Install and configure MariaDB on Ubuntu
  hosts: ubuntu01
  become: true

  vars_files:
    - ../vars/database.yaml

  vars:
    mariadb_packages:
      - mariadb-server
      - python3-pymysql

  tasks:

    - name: Install MariaDB packages
      ansible.builtin.apt:
        name: "{{ mariadb_packages }}"
        state: present

    - name: Bind MariaDB to any interface
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart mariadb server

    - name: MariaDB started and enabled
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    - name: Configure MariaDB root password
      community.mysql.mysql_user:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        check_implicit_admin: true
        name: root
        host: "{{ item }}"
        password: "{{ DB_ROOT_PW }}"
        state: present
      loop:
        - localhost
        - 127.0.0.1
      no_log: true

    - name: Create application database
      community.mysql.mysql_db:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        check_implicit_admin: false
        name: "{{ DB_DBASE }}"
        state: present

    - name: Check if cumpleanios table exists
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: "{{ lookup('ansible.builtin.file', playbook_dir + '/../sql/check_table.sql') }}"
      register: table_check
      changed_when: false

    - name: Create cumpleanios table
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: "{{ lookup('ansible.builtin.file', playbook_dir + '/../sql/create_table.sql') }}"
      when: table_check.rowcount[0] | int == 0

    - name: Insert missing birthday data
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_db: "{{ DB_DBASE }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        query: "{{ lookup('ansible.builtin.file', playbook_dir + '/../sql/insert_data.sql') }}"
      register: insert_data
      changed_when: insert_data.rowcount[0] | int > 0

    - name: Create application database user
      community.mysql.mysql_user:
        login_user: root
        login_password: "{{ DB_ROOT_PW }}"
        login_unix_socket: /run/mysqld/mysqld.sock
        check_implicit_admin: false
        name: "{{ DB_USER }}"
        password: "{{ DB_PASS }}"
        host: "%"
        priv: "{{ DB_DBASE }}.*:SELECT"
        state: present
      no_log: true

    - name: Allow MariaDB from application server
      community.general.ufw:
        port: 3306
        proto: tcp
        rule: allow
        from_ip: 10.0.2.15

  handlers:

    - name: Restart mariadb server
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted
